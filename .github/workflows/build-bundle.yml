name: Build SKAZI Bundle

# Builds every SKAZI plugin and the platform packages:
#   Mac:     SKAZI Bundle.pkg          (VST3 + AU + apps, Apple Silicon + Intel)
#   Windows: SKAZI Bundle Setup.exe    (VST3 + apps)
#   Linux:   SKAZI Bundle Linux.tar.gz (VST3 + apps)
# Download them from the run's "Artifacts" section. A v* tag also creates a
# GitHub Release containing all three packages.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      mac_arch:
        description: macOS architecture for manual builds
        type: choice
        required: true
        default: universal
        options:
          - universal
          - arm64
          - x86_64

jobs:
  mac:
    runs-on: macos-14
    env:
      MAC_ARCH: ${{ inputs.mac_arch || 'universal' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build plugins and SKAZI Bundle.pkg
        run: bash mac/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SKAZI-Bundle-Mac-${{ inputs.mac_arch || 'universal' }}
          path: dist/SKAZI Bundle.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugins and SKAZI Bundle Setup.exe
        shell: pwsh
        run: ./build_bundle.ps1 -BuildRoot C:\skz
      - uses: actions/upload-artifact@v4
        with:
          name: SKAZI-Bundle-Windows
          path: dist/SKAZI Bundle Setup.exe

  linux:
    # Build on the oldest supported hosted Ubuntu image so the binaries use
    # an older glibc baseline and run on newer Debian-family distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.0-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev
      - name: Build Linux bundle
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.1' }}
        run: bash linux/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SKAZI-Bundle-Linux
          path: |
            dist/SKAZI Bundle Linux.tar.gz
            dist/SKAZI Bundle Linux.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SKAZI Bundle $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "release-assets/SKAZI-Bundle-Mac-universal/SKAZI Bundle.pkg#SKAZI.Bundle.pkg" \
            "release-assets/SKAZI-Bundle-Windows/SKAZI Bundle Setup.exe#SKAZI.Bundle.Setup.exe" \
            "release-assets/SKAZI-Bundle-Linux/SKAZI Bundle Linux.tar.gz" \
            "release-assets/SKAZI-Bundle-Linux/SKAZI Bundle Linux.deb"
