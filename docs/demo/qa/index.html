<!doctype html><html lang="en"><meta charset="utf-8"><title>SKAZI local accessibility QA</title>
<style>body{font:14px system-ui;margin:0;background:#eee;color:#111}header{padding:12px;display:flex;gap:12px}button,select{font:inherit;padding:8px}iframe{display:block;border:0;width:100%;height:1000px;background:#111}pre{white-space:pre-wrap;padding:20px}</style>
<header><label>Viewport <select id="width"><option>1440</option><option>768</option><option>390</option><option>320</option></select></label><button id="run">Run accessibility audit</button><button id="intro-run">Audit opening</button><button id="all-run">Run all 28 cases</button><span id="status">Ready</span></header>
<iframe id="site" src="../../?qa=41&amp;intro=0" title="Website under test"></iframe><main><pre id="results">Choose a width and run.</pre></main>
<script>
document.querySelector('#run').onclick=async()=>{
 const frame=document.querySelector('#site'),button=document.querySelector('#run'),status=document.querySelector('#status');button.disabled=true;status.textContent='Running';
 try{
  frame.style.width=document.querySelector('#width').value+'px';
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(doc.readyState==='loading')await new Promise(resolve=>doc.addEventListener('DOMContentLoaded',resolve,{once:true}));
  await doc.fonts.ready;
  if(!doc.querySelector('.tool'))await new Promise(resolve=>{const observer=new MutationObserver(()=>{if(doc.querySelector('.tool')){observer.disconnect();resolve();}});observer.observe(doc.querySelector('#catalog'),{childList:true});});
  if(!win.axe)await new Promise((resolve,reject)=>{const script=doc.createElement('script');script.src='demo/qa/axe.min.js';script.onload=resolve;script.onerror=reject;doc.head.append(script);});
  const motion=doc.querySelector('.motion-toggle');if(motion.getAttribute('aria-pressed')!=='true')motion.click();
  const reports=[];
  for(const state of ['compact','mixer','pattern','sound','dialog','install']){
   if(state==='compact'){if(!doc.querySelector('#studio-advanced').hidden)doc.querySelector('#studio-advanced-toggle').click();}
   else if(state==='dialog')doc.querySelector('.feature button').click();
   else if(state==='install'){
    doc.querySelector('[data-daw="Cubase"]').click();doc.querySelector('.getting-started details').open=true;
    const download=doc.querySelector('#windows-download');download.addEventListener('click',event=>event.preventDefault(),{capture:true,once:true});download.click();
   }else doc.querySelector('[data-studio-panel="'+state+'"]').click();
   win.scrollTo({top:0,left:0,behavior:'instant'});
   await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
   const result=await win.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa','best-practice']}});
   reports.push({state,dialogOpen:doc.querySelector('dialog').open,violations:result.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:result.incomplete.map(v=>({id:v.id,count:v.nodes.length,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),passes:result.passes.length});
   if(state==='dialog')doc.querySelector('#plugin-dialog').close();
   if(state==='install'){doc.querySelector('#windows-note button').click();doc.querySelector('.getting-started details').open=false;}
  }
  doc.querySelector('[data-studio-panel="mixer"]').click();
  document.querySelector('#results').textContent=JSON.stringify({width:frame.clientWidth,axeVersion:win.axe.version,reports},null,2);status.textContent='Complete';
 }catch(error){status.textContent='Failed';document.querySelector('#results').textContent=String(error.stack||error);}
 finally{button.disabled=false;}
};
document.querySelector('#intro-run').onclick=async()=>{
 const frame=document.querySelector('#site'),status=document.querySelector('#status');status.textContent='Running';
 try{
  const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  frame.style.width=document.querySelector('#width').value+'px';frame.src='../../?qa=41&intro=1';await loaded;
  const doc=frame.contentDocument,win=frame.contentWindow;
  await new Promise((resolve,reject)=>{const script=doc.createElement('script');script.src='demo/qa/axe.min.js';script.onload=resolve;script.onerror=reject;doc.head.append(script);});
  const visibleAtStart=!doc.querySelector('#site-intro').hidden;if(!visibleAtStart)throw Error('Opening finished before audit');
  const result=await win.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa','best-practice']}});
  document.querySelector('#results').textContent=JSON.stringify({width:frame.clientWidth,state:'opening',visibleAtStart,violations:result.violations.map(v=>({id:v.id,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),passes:result.passes.length},null,2);
  doc.querySelector('.intro-skip').click();if(!doc.querySelector('#site-intro').hidden)await new Promise(resolve=>{const observer=new MutationObserver(()=>{if(doc.querySelector('#site-intro').hidden){observer.disconnect();resolve();}});observer.observe(doc.querySelector('#site-intro'),{attributes:true,attributeFilter:['hidden']});});status.textContent='Complete';
 }catch(error){status.textContent='Failed';document.querySelector('#results').textContent=String(error.stack||error);}
};
document.querySelector('#all-run').onclick=async()=>{const all=document.querySelector('#all-run');all.disabled=true;const results=[];for(const width of ['1440','768','390','320']){document.querySelector('#width').value=width;await document.querySelector('#run').onclick();results.push(JSON.parse(document.querySelector('#results').textContent));await document.querySelector('#intro-run').onclick();results.push(JSON.parse(document.querySelector('#results').textContent));}document.querySelector('#results').textContent=JSON.stringify({version:41,cases:results},null,2);document.querySelector('#status').textContent='All complete';all.disabled=false;};
</script></html>
