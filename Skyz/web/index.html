<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SKY Z</title>
<style>
  :root { --brass: #c9a35a; --brassL: #f1d999; --ink: #e9dcc0; --dim: #8d8a83; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #020408; color: var(--ink); font-family: "IBM Plex Mono", Consolas, "Courier New", monospace; overflow: hidden; }
  .serif { font-family: Cinzel, "Trajan Pro", "Palatino Linotype", Georgia, serif; }
  #app { width: 1240px; height: 900px; position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: top left;
         background: radial-gradient(ellipse at 50% 30%, #13204a 0%, #0a1129 45%, #04060e 100%); }
  #sky { position: absolute; inset: 0; pointer-events: none; }
  .plate { position: absolute; border: 1px solid rgba(201,163,90,.45); border-radius: 4px;
           background: linear-gradient(180deg, rgba(16,27,62,.82), rgba(8,13,32,.88));
           box-shadow: inset 0 1px 0 rgba(241,217,153,.10), inset 0 0 30px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.5); }
  .plate::before, .plate::after { content: ""; position: absolute; width: 14px; height: 14px; border: 1px solid var(--brass); opacity: .7; pointer-events: none; }
  .plate::before { left: 4px; top: 4px; border-right: 0; border-bottom: 0; }
  .plate::after { right: 4px; bottom: 4px; border-left: 0; border-top: 0; }
  .title { position: absolute; left: 14px; top: 6px; font-weight: 700; font-size: 11.5px; letter-spacing: 2.5px; color: var(--brassL); }
  .title small { font: 400 9px "IBM Plex Mono", Consolas, monospace; color: var(--dim); letter-spacing: 1px; margin-left: 8px; }
  .knob { position: absolute; text-align: center; user-select: none; cursor: ns-resize; }
  .knob svg { display: block; margin: 0 auto; overflow: visible; }
  .knob .l { font-size: 8.5px; letter-spacing: 1px; color: var(--ink); opacity: .8; margin-top: 1px; text-transform: uppercase; white-space: nowrap; }
  .knob .v { font-size: 9px; color: var(--brassL); height: 11px; white-space: nowrap; }
  .knob.drop svg { filter: drop-shadow(0 0 6px #ffe3a1); }
  .knob .mod { position: absolute; right: 2px; top: 0; width: 6px; height: 6px; border-radius: 50%; background: #9fc7ff; display: none; }
  .knob.modded .mod { display: block; }
  .sel { position: absolute; display: flex; gap: 3px; }
  .sel button, .btn { font: 500 9px "IBM Plex Mono", Consolas, monospace; letter-spacing: 1px; color: var(--ink); background: rgba(5,9,20,.7);
            border: 1px solid rgba(201,163,90,.35); border-radius: 3px; padding: 4px 6px; cursor: pointer; white-space: nowrap; }
  .sel button.on, .btn.on { color: #1a1206; background: linear-gradient(180deg, var(--brassL), var(--brass)); border-color: var(--brassL); }
  .dd { position: absolute; font: 500 10px "IBM Plex Mono", Consolas, monospace; color: var(--ink); background: #050914; border: 1px solid rgba(201,163,90,.45);
        border-radius: 3px; padding: 3px 6px; cursor: pointer; }
  canvas.disp { position: absolute; border: 1px solid rgba(201,163,90,.3); border-radius: 3px; background: #03060f; }
  .tag { position: absolute; font-size: 9px; color: var(--dim); letter-spacing: 1px; white-space: nowrap; }
  .led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3a2c12; margin-right: 5px; box-shadow: inset 0 0 2px #000; }
  .on .led { background: #ffe3a1; box-shadow: 0 0 6px #ffd27a; }
  #kbd { position: absolute; left: 240px; top: 836px; height: 54px; width: 990px; }
  .k { position: absolute; top: 0; height: 54px; background: linear-gradient(180deg, #e9e0cc, #b8ab8e); border: 1px solid #2b2414; border-radius: 0 0 3px 3px; }
  .k.b { height: 33px; background: linear-gradient(180deg, #1d2136, #05070d); z-index: 2; border-color: #000; }
  .k.down { background: linear-gradient(180deg, #ffe7a8, #c9a35a); }
  .wheel { position: absolute; top: 836px; width: 34px; height: 56px; cursor: ns-resize; }
  .wheel .wl { position: absolute; top: 46px; width: 34px; text-align: center; font-size: 7.5px; letter-spacing: 1px; color: var(--brassL); pointer-events: none; }
  .chip { cursor: grab; }
  #presetMenu { position: absolute; left: 520px; top: 50px; width: 520px; max-height: 760px; overflow-y: auto; z-index: 50; display: none;
                background: #050914; border: 1px solid var(--brass); border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.8); padding: 8px; }
  #presetMenu .cat { font-size: 10px; color: var(--brassL); letter-spacing: 2px; padding: 6px 4px 2px; cursor: pointer; }
  #presetMenu .items { display: none; columns: 2; }
  #presetMenu .cat.open + .items { display: block; }
  #presetMenu .it { font-size: 10px; padding: 2px 6px; cursor: pointer; color: var(--ink); }
  #presetMenu .it:hover, #presetMenu .it.cur { background: rgba(201,163,90,.25); }
  #status { position: absolute; left: 1050px; top: 4px; font-size: 8px; color: var(--dim); letter-spacing: 1px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="sky" width="1240" height="900"></canvas>
</div>
<script>
'use strict';
// =====================================================================================
// SKY Z by Asher Swissa. Every control registers a parameter here; the plugin builds its parameter list
// from dumpParams() (normalised 0..1 for everything), so ids and defaults live in one place.
// =====================================================================================
const app = document.getElementById('app');
function fit() { const s = Math.min(innerWidth / 1240, innerHeight / 900); app.style.transform = `scale(${s})`; app.style.left = Math.max(0, (innerWidth - 1240 * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();

const P = {}; // id -> { kind: 'knob'|'choice'|'bool', v, def, n, views: [fn] }
const host = window.__JUCE__ ? window.__JUCE__.backend : null;
function norm(p) { return p.kind === 'knob' ? p.v : p.kind === 'bool' ? (p.v ? 1 : 0) : (p.n > 1 ? p.v / (p.n - 1) : 0); }
function fromNorm(p, x) { return p.kind === 'knob' ? x : p.kind === 'bool' ? x > .5 : Math.round(x * (p.n - 1)); }
function reg(id, kind, def, n) { if (!P[id]) P[id] = { id, kind, v: def, def, n, views: [] }; return P[id]; }
function redraw(id) { P[id].views.forEach(f => f()); }
let dirty = {}, flushTimer = null;
function changed(id) {
  redraw(id);
  if (onChange[id]) onChange[id]();
  if (!host) return;
  dirty[id] = norm(P[id]);
  if (!flushTimer) flushTimer = setTimeout(() => { host.emitEvent('set', dirty); dirty = {}; flushTimer = null; }, 15);
}
function gesture(id, on) { if (host) { if (flushTimer) { clearTimeout(flushTimer); host.emitEvent('set', dirty); dirty = {}; flushTimer = null; } host.emitEvent('gesture', { id, on }); } }
const onChange = {};
function send(type, obj) { if (host) host.emitEvent(type, obj || {}); }

// ---------- value mapping (the C++ side mirrors these curves) ----------
function real(v, o) {
  if (o.curve === 'exp') return o.min * Math.pow(o.max / o.min, v);
  if (o.curve === 'pow') return o.min + Math.pow(v, 3) * (o.max - o.min);
  return o.min + v * (o.max - o.min);
}
function fmt(v, o) {
  if (o.fmt) return o.fmt(v);
  if (o.list) return o.list[Math.round(v * (o.list.length - 1))];
  if (o.unit === '%') return Math.round(v * 100) + '%';
  const x = real(v, o);
  if (o.unit === 'hz') return x >= 1000 ? (x / 1000).toFixed(1) + 'k' : x < 10 ? x.toFixed(2) + 'Hz' : Math.round(x) + '';
  if (o.unit === 's') return x < 1 ? Math.round(x * 1000) + 'ms' : x.toFixed(2) + 's';
  if (o.int) return (x > 0 && o.bi ? '+' : '') + Math.round(x) + (o.unit || '');
  return (Math.abs(x) < 10 ? x.toFixed(2) : Math.round(x)) + (o.unit || '');
}

// ---------- building blocks ----------
function el(tag, cls, parent, css) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); (parent || app).appendChild(e); return e; }
const pages = {}; let cur = null;
function page(name) { cur = pages[name] = el('div', '', app, { position: 'absolute', left: 0, top: 0, width: '1240px', height: '830px', display: name === 'OSC' ? 'block' : 'none' }); }
function showPage(name) { Object.entries(pages).forEach(([n, p]) => p.style.display = n === name ? 'block' : 'none'); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.textContent === name)); }
function plate(x, y, w, h, title, sub) { const p = el('div', 'plate', cur || app, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); const t = el('div', 'title serif', p); t.innerHTML = title + (sub ? `<small>${sub}</small>` : ''); return p; }
function tag(parent, x, y, t) { const e = el('div', 'tag', parent, { left: x + 'px', top: y + 'px' }); e.textContent = t; return e; }
function disp(parent, x, y, w, h) { const c = el('canvas', 'disp', parent, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); c.width = w * 2; c.height = h * 2; const g = c.getContext('2d'); g.scale(2, 2); return { c, g, w, h }; }

// Knob: brass astrolabe ring with engraved ticks, a night-sky face and a star as the pointer.
let uidN = 0;
function knob(parent, x, y, id, label, v, o = {}) {
  o = Object.assign({ min: 0, max: 1, unit: '%', size: 44 }, o);
  const p = reg(id, 'knob', v);
  p.o = p.o || o;
  const k = el('div', 'knob', parent, { left: x + 'px', top: y + 'px', width: (o.size + 18) + 'px' });
  k.dataset.id = id;
  const s = o.size, r = s / 2, uid = 'g' + (uidN++);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', s); svg.setAttribute('height', s); k.appendChild(svg);
  let ticks = '';
  for (let i = 0; i <= 36; i++) { const a = (-135 + i * 7.5) * Math.PI / 180, big = i % 6 === 0, r1 = r - 1.6, r2 = r - (big ? 4.6 : 3.2);
    ticks += `<line x1="${r + Math.sin(a) * r1}" y1="${r - Math.cos(a) * r1}" x2="${r + Math.sin(a) * r2}" y2="${r - Math.cos(a) * r2}" stroke="#2a1d08" stroke-width="${big ? 1.1 : .6}"/>`; }
  let dots = '';
  for (let i = 0; i < 7; i++) { const a = Math.random() * 6.28, d = Math.random() * (r - 10); dots += `<circle cx="${r + Math.cos(a) * d}" cy="${r + Math.sin(a) * d}" r="${.3 + Math.random() * .5}" fill="#fff" opacity="${.3 + Math.random() * .5}"/>`; }
  const th = o.theme === 'ice' ? { a: '#f2fbff', b: '#7fc4ff', c: '#163a6b', arc: '#bfe6ff', star: '#ffffff' } : { a: '#fff1c4', b: '#c9a35a', c: '#4a3614', arc: '#ffe3a1', star: '#fff6dc' };
  svg.innerHTML = `<defs>
      <radialGradient id="${uid}b" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="${th.a}"/><stop offset=".45" stop-color="${th.b}"/><stop offset="1" stop-color="${th.c}"/></radialGradient>
      <radialGradient id="${uid}f" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#22336b"/><stop offset="1" stop-color="#060b1d"/></radialGradient></defs>
    <circle cx="${r}" cy="${r + 1.5}" r="${r - 1}" fill="rgba(0,0,0,.55)"/><circle cx="${r}" cy="${r}" r="${r - 1}" fill="url(#${uid}b)"/>
    <circle cx="${r}" cy="${r}" r="${r - 5}" fill="#1b1407"/><circle cx="${r}" cy="${r}" r="${r - 6}" fill="url(#${uid}f)"/>${ticks}${dots}
    <path class="arc" fill="none" stroke="${th.arc}" stroke-width="${o.size > 50 ? 2.6 : 1.6}" stroke-linecap="round" opacity=".9"/>
    <g class="ptr"><line x1="${r}" y1="${r}" x2="${r}" y2="9" stroke="rgba(255,227,161,.35)" stroke-width="1"/>
      <path d="M0,-4 L1.2,-1.2 L4,0 L1.2,1.2 L0,4 L-1.2,1.2 L-4,0 L-1.2,-1.2Z" fill="${th.star}" transform="translate(${r},9) scale(${o.size > 50 ? 1.5 : 1})"/></g>
    <circle cx="${r}" cy="${r}" r="2.2" fill="#c9a35a"/>`;
  el('div', 'mod', k);
  const vEl = el('div', 'v', k); const lEl = el('div', 'l', k); lEl.textContent = label;
  if (o.theme === 'ice') { vEl.style.color = '#bfe6ff'; vEl.style.fontSize = '11px'; lEl.style.color = '#9fd4ff'; lEl.style.fontSize = '10px'; lEl.style.fontWeight = '700'; lEl.style.opacity = '1'; }
  const arc = svg.querySelector('.arc'), ptr = svg.querySelector('.ptr');
  function draw() {
    const a = -135 + p.v * 270;
    ptr.setAttribute('transform', `rotate(${a} ${r} ${r})`);
    const ar = r - 8, a0 = (o.bi ? 0 : -135) * Math.PI / 180, a1 = a * Math.PI / 180;
    const big = Math.abs(a1 - a0) > Math.PI ? 1 : 0, sw = a1 > a0 ? 1 : 0;
    arc.setAttribute('d', Math.abs(a1 - a0) < .01 ? '' : `M${r + Math.sin(a0) * ar},${r - Math.cos(a0) * ar} A${ar},${ar} 0 ${big} ${sw} ${r + Math.sin(a1) * ar},${r - Math.cos(a1) * ar}`);
    vEl.textContent = fmt(p.v, o);
  }
  p.views.push(draw);
  let y0, v0;
  svg.addEventListener('pointerdown', e => { y0 = e.clientY; v0 = p.v; svg.setPointerCapture(e.pointerId); gesture(id, true); });
  svg.addEventListener('pointermove', e => { if (y0 === undefined) return; const s = parseFloat(app.style.transform.slice(6)) || 1;
    p.v = Math.max(0, Math.min(1, v0 + (y0 - e.clientY) / s / (e.shiftKey ? 600 : 150))); changed(id); });
  svg.addEventListener('pointerup', () => { if (y0 !== undefined) gesture(id, false); y0 = undefined; });
  svg.addEventListener('dblclick', () => { p.v = p.def; changed(id); });
  svg.addEventListener('wheel', e => { e.preventDefault(); p.v = Math.max(0, Math.min(1, p.v - Math.sign(e.deltaY) * .02)); changed(id); }, { passive: false });
  // drop a mod source (planet, envelope, macro) onto the knob
  k.addEventListener('dragover', e => { if (TARGETS.indexOf(id) > 0) { e.preventDefault(); k.classList.add('drop'); } });
  k.addEventListener('dragleave', () => k.classList.remove('drop'));
  k.addEventListener('drop', e => { e.preventDefault(); k.classList.remove('drop'); const src = +e.dataTransfer.getData('text/plain'); if (src > 0) addRoute(src, id); });
  draw(); return k;
}
function row(parent, x, y, items, gap = 66, size = 44) { items.forEach(([id, l, v, o], i) => knob(parent, x + i * gap, y, id, l, v, Object.assign({ size }, o || {}))); }
function sel(parent, x, y, id, items, on = 0) {
  const p = reg(id, 'choice', on, items.length);
  const s = el('div', 'sel', parent, { left: x + 'px', top: y + 'px' });
  const bs = items.map((t, i) => { const b = el('button', '', s); b.textContent = t; b.onclick = () => { p.v = i; changed(id); }; return b; });
  p.views.push(() => bs.forEach((b, i) => b.classList.toggle('on', i === p.v)));
  redraw(id); return s;
}
function dd(parent, x, y, w, id, items, on = 0) {
  const p = reg(id, 'choice', on, items.length);
  const d = el('select', 'dd', parent, { left: x + 'px', top: y + 'px', width: w + 'px' });
  items.forEach(t => { el('option', '', d).textContent = t; });
  d.onchange = () => { p.v = d.selectedIndex; changed(id); };
  p.views.push(() => d.selectedIndex = p.v); redraw(id); return d;
}
function toggle(parent, x, y, id, text, on = true) {
  const p = reg(id, 'bool', on, 2);
  const b = el('button', 'btn', parent, { position: 'absolute', left: x + 'px', top: y + 'px' }); b.innerHTML = `<span class="led"></span>${text}`;
  b.onclick = () => { p.v = !p.v; changed(id); };
  p.views.push(() => b.classList.toggle('on', !!p.v)); redraw(id); return b;
}

// ---------- shared lists ----------
const DIVS = ['1/64', '1/32', '1/32T', '1/16', '1/16T', '1/16D', '1/8', '1/8T', '1/8D', '1/4', '1/4T', '1/4D', '1/2', '1 BAR', '2 BAR', '4 BAR', '8 BAR'];
const CONS = ['ORION', 'PLEIADES', 'LYRA', 'DRACO', 'CYGNUS', 'FLAT'];
const SOURCES = ['OFF', 'ORBIT I', 'ORBIT II', 'ORBIT III', 'ORBIT IV', 'MOD ENV', 'FILTER ENV', 'AMP ENV', 'VELOCITY', 'NOTE', 'MOD WHEEL', 'AFTERTOUCH', 'RANDOM', 'MACRO 1', 'MACRO 2', 'MACRO 3', 'MACRO 4'];
const TARGETS = ['OFF', 'bFine', 'aMorph', 'aTilt', 'aSpread', 'aOdd', 'aBlur', 'aLvl', 'bPw', 'bFm', 'bDet', 'bLvl', 'fCut', 'fRes', 'fDrive', 'f2Cut', 'subLvl', 'noise', 'ring', 'bPan', 'master', 'aShimmer', 'aPart'];
const TARGET_NAMES = ['OFF', 'PITCH', 'A MORPH', 'A TILT', 'A INHARM', 'A ODD/EVEN', 'A BLUR', 'A LEVEL', 'B SHAPE', 'B FM', 'B DETUNE', 'B LEVEL', 'CUTOFF', 'RESO', 'DRIVE', 'F2 CUTOFF', 'SUB', 'NOISE', 'RING', 'WIDTH', 'VOLUME', 'A TWINKLE', 'A PARTIALS'];
const ARP_MODES = ['UP', 'DOWN', 'UP-DOWN', 'DOWN-UP', 'RANDOM', 'AS PLAYED', 'CHORD', 'CONVERGE', 'DIVERGE', 'PSY ROLL', 'PINKY UP', 'THUMB'];
const PATTERNS = [ // name, gate (.=rest x=note A=accent -=tie), pitch per step (0-9 semis, o=+12, d=-12)
  ['PSY GALLOP', '.xxx.xxx.xxx.xxx', '0000000000000000'], ['PSY GALLOP OCT', '.xxA.xxA.xxA.xxA', '000o000o000o000o'], ['PSY TRIPLET', 'xxxxxxxxxxxxxxxx', '00o00o00o00o00o0'],
  ['ROLLING 16', 'AxxxAxxxAxxxAxxx', '0000000000000000'], ['OFFBEAT', '..x...x...x...x.', '0000000000000000'], ['OFFBEAT OCT', '..x...A...x...A.', '000000o000000000'],
  ['TECHNO STAB', 'x..x..x...x..x..', '0000000000000000'], ['TECHNO DRIVE', 'x.xAx.xxx.xAx.xx', '0000000000000000'], ['HOUSE ORGAN', '..x.x..x..x.x..x', '0000000000000000'],
  ['HOUSE BOUNCE', 'x..xx..x.xx..x.x', '000o0000000o0000'], ['BROKEN', 'x..x..x...x..x..', '0000000000000000'], ['STUTTER', 'xx..xx..xxx.x.x.', '0000000000000000'],
  ['TRANCE GATE', 'AxxxxxxxAxxxxxxx', '0000000000000000'], ['ACID 1', 'xAxxAx.xAxxAx.xA', '00o0000d00o00000'], ['ACID 2', 'x.Axx.Ax.xAx.Axx', '0o0000d00o000d00'],
  ['FIFTHS', 'xxxxxxxxxxxxxxxx', '0707070707070707'], ['OCTAVE JUMP', 'xxxxxxxxxxxxxxxx', '0o0o0o0o0o0o0o0o'], ['MINOR WALK', 'xxxxxxxxxxxxxxxx', '0035703570357035'],
  ['MAJOR WALK', 'xxxxxxxxxxxxxxxx', '0047704770477047'], ['LONG TIES', 'x---x---x-x-x---', '0000000000000000'], ['USER', '', '']];

// =====================================================================================
// HEADER
// =====================================================================================
const head = el('div', '', app, { position: 'absolute', left: 0, top: 0, width: '1240px', height: '58px', borderBottom: '1px solid rgba(201,163,90,.4)', background: 'linear-gradient(180deg, rgba(30,44,90,.6), rgba(6,10,24,.2))', zIndex: 5 });
el('img', '', head, { position: 'absolute', left: '14px', top: '7px', height: '44px' }).src = 'skazi_logo.png';
el('div', '', head, { position: 'absolute', left: '106px', top: '10px', width: '1px', height: '38px', background: 'rgba(201,163,90,.5)' });
el('div', 'serif', head, { position: 'absolute', left: '120px', top: '2px', fontWeight: 700, fontSize: '30px', letterSpacing: '10px', color: '#f1d999', textShadow: '0 0 14px rgba(255,214,130,.25)' }).innerHTML = 'SKY <span style="color:#ffe3a1;font-size:34px">Z</span>';
el('div', 'serif', head, { position: 'absolute', left: '123px', top: '40px', fontWeight: 700, fontSize: '9.5px', letterSpacing: '3px', color: '#c9a35a' }).textContent = 'BY ASHER SWISSA';
['OSC', 'MOD', 'FX', 'ARP'].forEach((t, i) => { const b = el('button', 'btn tab' + (i === 0 ? ' on' : ''), head, { position: 'absolute', left: (282 + i * 58) + 'px', top: '16px', width: '52px' }); b.textContent = t; b.onclick = () => showPage(t); });
const pv = el('div', '', head, { position: 'absolute', left: '520px', top: '10px', width: '360px', height: '38px', border: '1px solid rgba(201,163,90,.5)', borderRadius: '3px', background: '#03060f', cursor: 'pointer' });
const pvCat = el('div', '', pv, { position: 'absolute', left: '10px', top: '4px', fontSize: '8.5px', color: '#8d8a83', letterSpacing: '2px' });
const pvName = el('div', 'serif', pv, { position: 'absolute', left: '10px', top: '16px', fontWeight: 700, fontSize: '14px', color: '#f1d999', letterSpacing: '2px', whiteSpace: 'nowrap' });
el('div', '', pv, { position: 'absolute', right: '10px', top: '12px', fontSize: '10px', color: '#c9a35a' }).textContent = '▼';
const menu = el('div', '', app); menu.id = 'presetMenu';
let presetList = [], presetIndex = 0, presetName = 'INIT';
function showPreset() { const n = presetName.split(' // '); pvCat.textContent = (n.length > 1 ? n[0] : 'USER') + '  ·  ' + String(presetIndex + 1).padStart(3, '0') + ' / ' + presetList.length; pvName.textContent = n.length > 1 ? n[1] : n[0]; }
function buildMenu() {
  menu.innerHTML = ''; const cats = {};
  presetList.forEach((n, i) => { const c = n.includes(' // ') ? n.split(' // ')[0] : 'USER'; (cats[c] = cats[c] || []).push([n, i]); });
  Object.entries(cats).forEach(([c, items]) => { const h = el('div', 'cat', menu); h.textContent = c + '  (' + items.length + ')'; const box = el('div', 'items', menu);
    h.onclick = () => h.classList.toggle('open');
    items.forEach(([n, i]) => { const it = el('div', 'it' + (i === presetIndex ? ' cur' : ''), box); it.textContent = n.split(' // ').pop(); it.onclick = () => { send('preset', { index: i }); menu.style.display = 'none'; }; }); });
}
